name: Build Wheels & Publish to PyPI

on:
  pull_request:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: read

env:
  USE_BAZEL_VERSION: 7.7.0

jobs:
  build_wheels:
    name: Build wheels
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
    - name: Check out the repo
      uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      with:
        persist-credentials: false

    - name: Set up python
      uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
      with:
        python-version: '3.10'

    - name: Install Protoc
      uses: arduino/setup-protoc@c65c819552d16ad3c9b72d9dfd5ba5237b9c906b # v3.0.0

    - name: Remove buggy sitecustomize
      run: |
        sudo find /etc/ -name "*sitecustomize*" -print -delete || true
        sudo find /usr/ -name "*sitecustomize*" -print -delete || true
        sudo find /opt/ -name "*sitecustomize*" -print -delete || true
        sudo find /home/runner/ -name "*sitecustomize*" -print -delete || true

    - name: install python dependencies
      run: |
        pip install --upgrade pip build twine
        pip install .

    - name: build wheel
      run: |
        python -m build --wheel -o wheelhouse

    - name: List and check wheel
      run: |
        ls -lh wheelhouse/
        twine check wheelhouse/*

    - name: Upload wheel
      uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
      with:
        name: wheels
        path: ./wheelhouse/*.whl

  upload_to_pypi:
    name: Upload to PyPI
    runs-on: ubuntu-latest
    if: (github.event_name == 'release' && startsWith(github.ref, 'refs/tags')) || (github.event_name == 'workflow_dispatch')
    needs: [build_wheels]
    environment:
      name: pypi
      url: https://pypi.org/p/tensorflow-model-analysis
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Retrieve wheels and sdist
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          merge-multiple: true
          path: wheels/

      - name: List the build artifacts
        run: |
          ls -lAs wheels/

      - name: Upload to PyPI
        # zizmor: ignore[use-trusted-publishing]
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}
          packages-dir: wheels/
          verify-metadata: false
          verbose: true
